<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Teamio - Streamline your team's workflow and achieve your goals with a premium, modern experience."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Teamio</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      .loading-screen {
        position: absolute;
        inset: 0;
        background-color: white;
        z-index: -1;
      }

      .loading-screen .center {
        display: grid;
        place-items: center;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app" style="background-color: var(--color-background)"></div>

    <script type="module" src="/src/main.tsx"></script>
